networks:
  factory-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  grafana_data:

services:
  # ─────────────────────────────────────────
  #  INFRASTRUCTURE
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: factory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory_secret
      POSTGRES_DB: factory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - factory-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: factory-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secret --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - factory-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: factory-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    networks:
      - factory-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  #  OBSERVABILITY
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: factory-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - factory-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: factory-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_secret
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - factory-net
    depends_on:
      - prometheus

  # ─────────────────────────────────────────
  #  APPLICATION SERVICES
  # ─────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: factory-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://factory:factory_secret@postgres:5432/factory_db
      REDIS_URL: redis://:redis_secret@redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: super_secret_jwt_key_change_in_production
      ORCHESTRATOR_URL: http://orchestrator-service:4001
      DB_SSL: "false"
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "3000:3000"
    networks:
      - factory-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  orchestrator-service:
    build:
      context: .
      dockerfile: ./services/orchestrator-service/Dockerfile
    container_name: factory-orchestrator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://factory:factory_secret@postgres:5432/factory_db
      REDIS_URL: redis://:redis_secret@redis:6379
      NATS_URL: nats://nats:4222
      AGENT_RUNTIME_URL: http://agent-runtime-service:8000
    ports:
      - "4001:4001"
    networks:
      - factory-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy


  agent-runtime-service:
    build:
      context: ./services/agent-runtime-service
      dockerfile: Dockerfile
    container_name: factory-agent-runtime
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://factory:factory_secret@postgres:5432/factory_db
      REDIS_URL: redis://:redis_secret@redis:6379
      NATS_URL: nats://nats:4222
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:8080}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-smart-factory}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    ports:
      - "8000:8000"
    networks:
      - factory-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: factory-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
    ports:
      - "8080:3000"
    networks:
      - factory-net
    depends_on:
      - api-gateway
