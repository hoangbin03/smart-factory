global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: /metrics

  - job_name: 'orchestrator-service'
    static_configs:
      - targets: ['orchestrator-service:4001']
    metrics_path: /metrics

  - job_name: 'workflow-service'
    static_configs:
      - targets: ['workflow-service:4002']
    metrics_path: /metrics

  - job_name: 'task-service'
    static_configs:
      - targets: ['task-service:4003']
    metrics_path: /metrics

  - job_name: 'agent-registry-service'
    static_configs:
      - targets: ['agent-registry-service:4004']
    metrics_path: /metrics

  - job_name: 'approval-service'
    static_configs:
      - targets: ['approval-service:4005']
    metrics_path: /metrics

  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:4006']
    metrics_path: /metrics

  - job_name: 'agent-runtime-service'
    static_configs:
      - targets: ['agent-runtime-service:8000']
    metrics_path: /metrics

  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: /metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
